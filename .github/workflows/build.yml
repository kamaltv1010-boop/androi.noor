# Builds Noor for Android: an APK every phone installs, signed with the same
# key each time, so a new version installs over the last. Every build of main
# becomes a release (v1.0.<run number>); a pushed tag like v1.2.0 makes a
# release of that version. The emulator job opens pages in Noor on a real
# Android to check the protection.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# One build at a time: the first one makes the signing key.
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NOOR_KEYSTORE_PASSWORD: noor-android-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test
        run: gradle --no-daemon testDebugUnitTest

      # Every build has its own version: 1.0.<run number>, or the tag's
      # version for a release (v1.2.0 -> 1.2.0).
      - name: Version this build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="1.0.$GITHUB_RUN_NUMBER"
          fi
          echo "NOOR_VERSION=$version" >> "$GITHUB_ENV"
          echo "NOOR_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Building Noor $version"

      # The key every version is signed with, so each one installs over the
      # last: kept as the file of a draft release, which only the
      # repository's owner and collaborators can see; made by the first build.
      - name: Signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/noor.jks"
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.draft and .name == "signing-key")] | last | .id // empty')
          if [ -n "$id" ]; then
            asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" --jq '.[] | select(.name == "noor.jks") | .id')
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > "$key"
            echo "Using the signing key kept in draft release $id"
          else
            keytool -genkeypair -keystore "$key" -alias noor -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass "$NOOR_KEYSTORE_PASSWORD" -keypass "$NOOR_KEYSTORE_PASSWORD" -dname "CN=Noor, O=kamaltv1010-boop"
            gh release create signing-key --draft --title signing-key \
              --notes "The key Noor's APKs are signed with, so each version installs over the last. Keep this draft: deleting it makes the next build sign with a new key, and phones would have to uninstall Noor before installing it." \
              "$key"
            echo "Made a new signing key"
          fi
          keytool -list -keystore "$key" -storepass "$NOOR_KEYSTORE_PASSWORD" | grep -i fingerprint || true
          echo "NOOR_KEYSTORE=$key" >> "$GITHUB_ENV"

      - name: Build the APK
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "Noor-$NOOR_VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Noor-${{ env.NOOR_VERSION }}
          path: Noor-*.apk
          if-no-files-found: error

      - name: Release notes
        run: |
          {
            echo "Build $NOOR_VERSION of commit ${GITHUB_SHA::7}."
            echo
            echo '```'
            git log -1 --pretty=%B
            echo '```'
            echo
            echo "Android 8 or later. Download Noor-$NOOR_VERSION.apk on the phone and open it; the first time, Android asks to allow installing from the browser or files app."
          } > release-notes.md

      - name: Publish the release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NOOR_VERSION }}
          name: Noor for Android ${{ env.NOOR_VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: Noor-*.apk
          fail_on_unmatched_files: true

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open pages in Noor on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest

      - name: What the test saw
        if: always()
        run: find app/build -path '*androidTest-results*' -name '*.txt' -exec cat {} \; 2>/dev/null | grep -E "NoorTest|probe|brands|FAILED|Assertion" | head -50 || true
