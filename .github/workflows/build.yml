# Builds Noor for Android: an APK every phone installs, signed with the same
# key each time, so a new version installs over the last. The emulator job
# opens pages in Noor on a real Android to check the protection. Every build
# of main becomes a release (v1.0.<run number>), and a pushed tag like v1.2.0
# a release of that version, only once both jobs passed (the release job
# waits for them); its description is in Arabic, from CHANGELOG.md. Run by
# hand on another branch, it builds and tests, and publishes nothing.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Read only, but for the two jobs that need to write (below): the emulator
# job, with actions from outside GitHub, can't reach the signing key.
permissions:
  contents: read

# One build at a time: the first one makes the signing key.
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The signing key is the file of a draft release, which only a token
    # that may write reads (and the first build makes it).
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      NOOR_KEYSTORE_PASSWORD: noor-android-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test
        run: gradle --no-daemon testDebugUnitTest

      # Every build has its own version: 1.0.<run number>, or the tag's
      # version for a release (v1.2.0 -> 1.2.0).
      - name: Version this build
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="1.0.$GITHUB_RUN_NUMBER"
          fi
          echo "NOOR_VERSION=$version" >> "$GITHUB_ENV"
          echo "NOOR_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Noor $version"

      # The key every version is signed with, so each one installs over the
      # last: kept as the file of a draft release, which only the
      # repository's owner and collaborators can see; made by the first build.
      - name: Signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/noor.jks"
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.draft and .name == "signing-key")] | last | .id // empty')
          if [ -n "$id" ]; then
            asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" --jq '.[] | select(.name == "noor.jks") | .id')
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > "$key"
            echo "Using the signing key kept in draft release $id"
          else
            keytool -genkeypair -keystore "$key" -alias noor -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass "$NOOR_KEYSTORE_PASSWORD" -keypass "$NOOR_KEYSTORE_PASSWORD" -dname "CN=Noor, O=kamaltv1010-boop"
            gh release create signing-key --draft --title signing-key \
              --notes "The key Noor's APKs are signed with, so each version installs over the last. Keep this draft: deleting it makes the next build sign with a new key, and phones would have to uninstall Noor before installing it." \
              "$key"
            echo "Made a new signing key"
          fi
          keytool -list -keystore "$key" -storepass "$NOOR_KEYSTORE_PASSWORD" | grep -i fingerprint || true
          echo "NOOR_KEYSTORE=$key" >> "$GITHUB_ENV"

      - name: Build the APK
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "Noor-$NOOR_VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Noor-${{ env.NOOR_VERSION }}
          path: Noor-*.apk
          if-no-files-found: error

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open pages in Noor on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest

      - name: What the test saw
        if: always()
        run: find app/build -path '*androidTest-results*' -name '*.txt' -exec cat {} \; 2>/dev/null | grep -E "NoorTest|probe|brands|FAILED|Assertion" | head -50 || true

  # A version users install: the APK the android job built and signed, once
  # Noor also opened pages on the emulator; from main or a version tag only.
  release:
    needs: [android, emulator]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      NOOR_VERSION: ${{ needs.android.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Noor-${{ needs.android.outputs.version }}

      # The release's description, in Arabic: what this version fixes and
      # changes, from its own section of CHANGELOG.md, or "Unreleased" until
      # it has one; then how to install it.
      - name: Release notes
        run: |
          section() { awk -v h="## $1" '$0 == h { on = 1; next } on && /^## / { exit } on' CHANGELOG.md; }
          changes="$(section "$NOOR_VERSION")"
          if [ -z "$(printf '%s' "$changes" | tr -d '[:space:]')" ]; then changes="$(section "Unreleased")"; fi
          {
            echo "## نور لـ Android $NOOR_VERSION"
            echo
            echo "### ما الذي أُصلح وتغيّر في هذه النسخة"
            echo
            if [ -n "$(printf '%s' "$changes" | tr -d '[:space:]')" ]; then printf '%s\n' "$changes"; else git log -1 --pretty=%B; fi
            echo
            echo "### التثبيت"
            echo
            echo "يعمل على Android 8 أو أحدث. نزّل الملف \`Noor-$NOOR_VERSION.apk\` على الهاتف وافتحه. في المرة الأولى يطلب Android السماح بالتثبيت من المتصفح أو من تطبيق الملفات."
            echo
            echo "الـ commit: \`${GITHUB_SHA::7}\`"
          } > release-notes.md
          cat release-notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NOOR_VERSION }}
          name: Noor for Android ${{ env.NOOR_VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: Noor-*.apk
          fail_on_unmatched_files: true
